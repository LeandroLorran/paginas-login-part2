<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Login - 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jockey+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="0stylefake.css" />
  </head>
  <body>
    <div>
      <div class="pagina">
        <img src="Assets/Pag1/chris-lee-70l1tDAI6rM-unsplash 1.png" alt="" />
        <div class="formulario">
          <h1>Get Started Now</h1>

          <form class="inputs">
            <label>Name</label>
            <input type="text" placeholder="Enter your name" />

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" />

            <label>Password</label>
            <input type="password" placeholder="Password" />
          </form>

          <div class="termo">
            <input type="checkbox" id="termo" />
            <label for="termo">I agree to the terms & policy</label>
          </div>

          <button class="entrar">Signup</button>

          <div class="linha">
            <hr />
            <p>Or</p>
          </div>

          <div class="botoes">
            <button class="botao1">Sing in With Google</button>
            <button class="botao2">Sing in With Apple</button>
          </div>

          <h2>Have an Account? <a href=""> Sing in</a></h2>
        </div>
      </div>
    </div>
  </body>
</html>
